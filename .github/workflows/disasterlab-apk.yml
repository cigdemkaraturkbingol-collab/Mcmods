name: Build Disaster Lab APK

on:
  push:
    branches: [ disasterlab-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p disasterlab-apk assembleDebug --stacktrace
      - name: Collect APK
        run: cp disasterlab-apk/app/build/outputs/apk/debug/app-debug.apk DisasterLab_V0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DisasterLab_V0.1_APK
          path: DisasterLab_V0.1.apk
          if-no-files-found: error
