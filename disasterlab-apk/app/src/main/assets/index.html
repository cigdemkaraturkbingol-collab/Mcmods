<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Disaster Lab 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
.card{background:rgba(8,12,18,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.13);border-radius:15px;padding:10px;box-shadow:0 8px 25px #0005;pointer-events:auto}
#title{font-weight:900;font-size:19px;letter-spacing:1px}
#status{font-size:12px;opacity:.85;margin-top:3px}
#disasters{position:absolute;right:12px;bottom:15px;display:grid;grid-template-columns:repeat(2,72px);gap:8px;pointer-events:auto}
button{border:0;border-radius:14px;background:rgba(18,24,32,.88);color:white;font-weight:800;padding:10px 6px;min-height:58px;border:1px solid rgba(255,255,255,.12)}
button:active{transform:scale(.95);background:#38495e}
#joy{position:absolute;left:20px;bottom:22px;width:145px;height:145px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff24;pointer-events:auto}
#stick{position:absolute;width:62px;height:62px;left:41px;top:41px;border-radius:50%;background:#ffffff55;border:2px solid #ffffff88}
#powerBox{position:absolute;top:88px;right:12px;width:160px;pointer-events:auto}
input{width:100%}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.55;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
  <div id="top"><div class="card"><div id="title">DISASTER LAB 3D</div><div id="status">Şehir sakin. Afet seç.</div></div></div>
  <div id="powerBox" class="card">Şiddet: <b id="pv">6</b><input id="power" type="range" min="1" max="10" value="6"></div>
  <div id="joy"><div id="stick"></div></div>
  <div id="disasters">
    <button onclick="tornado()">🌪️<br>HORTUM</button>
    <button onclick="meteor()">☄️<br>METEOR</button>
    <button onclick="quake()">🌎<br>DEPREM</button>
    <button onclick="resetCity()">🔄<br>SIFIRLA</button>
  </div>
  <div id="hint">Sol joystick: hareket • Ekranı sürükle: kamerayı çevir</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7d93a8);scene.fog=new THREE.Fog(0x7d93a8,35,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9e9ff,0x43513c,1.65));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-25,40,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x65725d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function road(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.035,d),new THREE.MeshStandardMaterial({color:0x252a2e,roughness:1}));m.position.set(x,.02,z);m.receiveShadow=true;scene.add(m)}
road(0,0,10,120);road(0,0,120,10);road(-30,0,6,120);road(30,0,6,120);road(0,-30,120,6);road(0,30,120,6);
let buildings=[],debris=[],effects=[];const colors=[0xb9b2a7,0x9ca6ad,0xc5b69b,0x7f8c96,0xa99b91,0xc7c9c4];
function addBuilding(x,z,w,h,d){const group=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)],roughness:.86}));body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;group.add(body);const winMat=new THREE.MeshStandardMaterial({color:0x8ec9df,emissive:0x18323b,roughness:.35});for(let yy=2;yy<h-1;yy+=2.2){for(let xx=-w/2+1;xx<w/2-.5;xx+=1.7){const win=new THREE.Mesh(new THREE.PlaneGeometry(.75,.8),winMat);win.position.set(xx,yy,d/2+.011);group.add(win)}}group.position.set(x,0,z);group.userData={vel:new THREE.Vector3(),spin:new THREE.Vector3(),broken:false};scene.add(group);buildings.push(group)}
function buildCity(){for(let x=-50;x<=50;x+=10){for(let z=-50;z<=50;z+=10){if(Math.abs(x)<7||Math.abs(z)<7||Math.abs(x-30)<5||Math.abs(x+30)<5||Math.abs(z-30)<5||Math.abs(z+30)<5)continue;if(Math.random()<.22)continue;addBuilding(x+(Math.random()-.5)*2,z+(Math.random()-.5)*2,5+Math.random()*2,5+Math.random()*13,5+Math.random()*2)}}}buildCity();
const player=new THREE.Object3D();player.position.set(0,0,18);scene.add(player);camera.position.set(0,7,11);player.add(camera);let yaw=0,pitch=-.18,joyX=0,joyY=0,shake=0;
const status=document.getElementById("status"),power=document.getElementById("power"),pv=document.getElementById("pv");power.oninput=()=>pv.textContent=power.value;const P=()=>+power.value;
let tornadoObj=null,tornadoLife=0;
window.tornado=()=>{status.textContent="HORTUM oluşuyor!";if(tornadoObj)scene.remove(tornadoObj);tornadoObj=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x5d6670,transparent:true,opacity:.52,roughness:1});for(let i=0;i<20;i++){const r=.45+i*.12;const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.18,6,18),mat);ring.rotation.x=Math.PI/2;ring.position.y=.4+i*.38;ring.rotation.z=Math.random()*3;tornadoObj.add(ring)}tornadoObj.position.set(-18,0,-16);scene.add(tornadoObj);tornadoLife=16;scene.background.set(0x45515e);scene.fog.color.set(0x45515e)};
window.meteor=()=>{status.textContent="METEOR geliyor!";const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),new THREE.MeshStandardMaterial({color:0x3a1608,emissive:0xff3b00,emissiveIntensity:2.7,roughness:1}));m.position.set(-25+Math.random()*50,35,-25+Math.random()*50);m.userData.vel=new THREE.Vector3((Math.random()-.5)*4,-28,(Math.random()-.5)*4);scene.add(m);effects.push({type:"meteor",obj:m})};
function explode(pos){status.textContent="💥 ÇARPIŞMA!";shake=.7+P()*.07;const flash=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xff9a22,transparent:true,opacity:.9}));flash.position.copy(pos);scene.add(flash);effects.push({type:"blast",obj:flash,age:0});buildings.forEach(b=>{const d=b.position.distanceTo(pos);if(d<9+P()*1.2){const dir=b.position.clone().sub(pos).normalize();b.userData.vel.add(dir.multiplyScalar((12+P()*2)*(1-d/(20+P()))));b.userData.vel.y+=4+P()*.7;b.userData.spin.set(Math.random()*2,Math.random()*2,Math.random()*2);b.userData.broken=true}});for(let i=0;i<30+P()*4;i++){const chunk=new THREE.Mesh(new THREE.BoxGeometry(.25+Math.random()*.7,.25+Math.random()*.7,.25+Math.random()*.7),new THREE.MeshStandardMaterial({color:0x5a4a3d}));chunk.position.copy(pos);chunk.userData.vel=new THREE.Vector3((Math.random()-.5)*18,4+Math.random()*15,(Math.random()-.5)*18);scene.add(chunk);debris.push(chunk)}}
window.quake=()=>{status.textContent="🌎 DEPREM!";shake=2+P()*.22;buildings.forEach(b=>{if(Math.random()<P()/13){b.userData.broken=true;b.userData.vel.add(new THREE.Vector3((Math.random()-.5)*4,Math.random()*2,(Math.random()-.5)*4));b.userData.spin.set((Math.random()-.5)*1.5,(Math.random()-.5)*.4,(Math.random()-.5)*1.5)}})};
window.resetCity=()=>{buildings.forEach(b=>scene.remove(b));buildings=[];debris.forEach(d=>scene.remove(d));debris=[];effects.forEach(e=>scene.remove(e.obj));effects=[];if(tornadoObj){scene.remove(tornadoObj);tornadoObj=null}scene.background.set(0x7d93a8);scene.fog.color.set(0x7d93a8);buildCity();status.textContent="Şehir sıfırlandı."};
const joy=document.getElementById("joy"),stick=document.getElementById("stick");function joyMove(e){const r=joy.getBoundingClientRect(),t=e;let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),len=Math.hypot(x,y),max=45;if(len>max){x=x/len*max;y=y/len*max}joyX=x/max;joyY=y/max;stick.style.transform=`translate(${x}px,${y}px)`}joy.addEventListener("pointerdown",e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{if(e.buttons)joyMove(e)});joy.addEventListener("pointerup",()=>{joyX=joyY=0;stick.style.transform=""});
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener("pointermove",e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.003;pitch=Math.max(-.7,Math.min(.25,pitch));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener("pointerup",()=>dragging=false);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);player.rotation.y=yaw;camera.rotation.x=pitch;const f=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));player.position.addScaledVector(f,-joyY*12*dt);player.position.addScaledVector(r,joyX*12*dt);player.position.x=Math.max(-56,Math.min(56,player.position.x));player.position.z=Math.max(-56,Math.min(56,player.position.z));if(tornadoObj&&tornadoLife>0){tornadoLife-=dt;tornadoObj.rotation.y+=dt*5;tornadoObj.position.x+=dt*1.7;tornadoObj.position.z+=Math.sin(performance.now()*.001)*dt*1.2;buildings.forEach(b=>{const dist=b.position.distanceTo(tornadoObj.position);if(dist<9+P()*.65){const pull=tornadoObj.position.clone().sub(b.position).normalize();b.userData.broken=true;b.userData.vel.addScaledVector(pull,dt*(12+P()*2));b.userData.vel.y+=dt*(5+P());b.userData.spin.y+=dt*2}});if(tornadoLife<=0){scene.remove(tornadoObj);tornadoObj=null;scene.background.set(0x7d93a8);scene.fog.color.set(0x7d93a8);status.textContent="Hortum dağıldı."}}buildings.forEach(b=>{if(b.userData.broken){b.userData.vel.y-=9.8*dt;b.position.addScaledVector(b.userData.vel,dt);b.rotation.x+=b.userData.spin.x*dt;b.rotation.y+=b.userData.spin.y*dt;b.rotation.z+=b.userData.spin.z*dt;if(b.position.y<0){b.position.y=0;b.userData.vel.multiplyScalar(.72);b.userData.vel.y=Math.abs(b.userData.vel.y)*.18}}});debris.forEach(d=>{d.userData.vel.y-=9.8*dt;d.position.addScaledVector(d.userData.vel,dt);d.rotation.x+=dt*3;if(d.position.y<.1){d.position.y=.1;d.userData.vel.multiplyScalar(.65)}});for(let i=effects.length-1;i>=0;i--){const e=effects[i];if(e.type==="meteor"){e.obj.position.addScaledVector(e.obj.userData.vel,dt);e.obj.rotation.x+=dt*5;if(e.obj.position.y<=.7){explode(e.obj.position.clone());scene.remove(e.obj);effects.splice(i,1)}}else if(e.type==="blast"){e.age+=dt;e.obj.scale.setScalar(1+e.age*14);e.obj.material.opacity=Math.max(0,.9-e.age*1.8);if(e.age>.55){scene.remove(e.obj);effects.splice(i,1)}}}if(shake>0){shake-=dt;camera.position.x=(Math.random()-.5)*shake*.25;camera.position.y=7+(Math.random()-.5)*shake*.18}else{camera.position.x*=.82;camera.position.y+=(7-camera.position.y)*.18}renderer.render(scene,camera)}animate();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
